[project]
name = "agentic-document-searcher"
version = "0.1.0"
description = "Agentic RAG system benchmarking Pinecone vs. Weaviate for retrieval quality, with an evaluation harness."
readme = "README"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-text-splitters",
    "requests",
    "beautifulsoup4",
    "lxml",
    "tiktoken",
    "openai",
    "pinecone",
    "weaviate-client",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["DTZ011"]  # date.today() is fine for fiscal-year cutoffs, not user-facing timestamps
